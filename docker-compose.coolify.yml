# Produzione su Coolify, a costo minimo: nessun Ollama e nessun gateway. L'app chiama Vertex AI direttamente
# con il service account di produzione (VERTEX_CREDENTIALS_JSON nei secrets di Coolify): docs/ops/vertex-diretto.md.
# Ollama resta solo in docker-compose.yml (sviluppo).
# Postgres NON e' in questo file: e' una risorsa Coolify a parte (volume persistente + backup: docs/ops/backup.md).
version: '3.8'

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  KEYCLOAK_URL: ${KEYCLOAK_URL:-https://keycloak-pw9ut4s1h3aodstrsw1gd84o.89.168.29.98.sslip.io}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aidbcreator}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-aidbcreator-app}
  LLM_PROVIDER: ${LLM_PROVIDER:-vertex}
  # Modalita' ricerca: true = strumenti di studio accesi, false = solo il prodotto
  RESEARCH_MODE: ${RESEARCH_MODE:-false}
  LOG_FORMAT: json
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # URL pubblico dell'app (senza slash finale): da' il redirect URI Keycloak <APP_PUBLIC_URL>/* (copre /app). docs/ops/dominio-https.md
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?imposta APP_PUBLIC_URL (es. https://aidbcreator.tecniaweb.it)}
  ENVIRONMENT: production
  ADMIN_ROLE: ${ADMIN_ROLE:-aidb-admin}
  DEFAULT_DAILY_AI_QUOTA: ${DEFAULT_DAILY_AI_QUOTA:-10}
  DAILY_AI_BUDGET_TOTAL: ${DAILY_AI_BUDGET_TOTAL:-150}
  # Vertex AI diretto. VERTEX_CREDENTIALS_JSON = contenuto del JSON del service account aidb-prod (solo secret Coolify).
  VERTEX_PROJECT: ${VERTEX_PROJECT:-aidbcreator-research-2026}
  VERTEX_LOCATION: ${VERTEX_LOCATION:-europe-west4}
  VERTEX_CREDENTIALS_JSON: ${VERTEX_CREDENTIALS_JSON:?imposta VERTEX_CREDENTIALS_JSON nei secrets di Coolify}
  VERTEX_MODEL: ${VERTEX_MODEL:-gemini-2.5-flash-lite}
  VERTEX_MAX_OUTPUT_TOKENS: ${VERTEX_MAX_OUTPUT_TOKENS:-2048}
  # Modelli selezionabili nelle impostazioni: in produzione senza il modello Pro (costo)
  VERTEX_ALLOWED_MODELS: ${VERTEX_ALLOWED_MODELS:-gemini-2.5-flash-lite,gemini-2.5-flash}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      <<: *app-env
      # Servono solo al bootstrap del realm (keycloak_setup.py): il worker non le riceve.
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: always

  redis:
    image: redis:7-alpine
    # Password obbligatoria (REDIS_PASSWORD: stringa esadecimale, openssl rand -hex 24). Nessuna porta pubblicata.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?imposta REDIS_PASSWORD nei secrets di Coolify}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  redis_data:
