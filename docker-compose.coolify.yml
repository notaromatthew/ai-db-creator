version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-https://keycloak-pw9ut4s1h3aodstrsw1gd84o.89.168.29.98.sslip.io}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-aidbcreator}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-aidbcreator-app}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollamaapi-u11fj34m2h9druz26hamz3xb.89.168.29.98.sslip.io}

      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_MODE=${OLLAMA_MODE:-remote}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Modalita' ricerca: true = strumenti di studio accesi, false = solo il prodotto
      - RESEARCH_MODE=${RESEARCH_MODE:-false}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - ADMIN_ROLE=${ADMIN_ROLE:-aidb-admin}
      - DEFAULT_DAILY_AI_QUOTA=${DEFAULT_DAILY_AI_QUOTA:-20}
      - DAILY_AI_BUDGET_TOTAL=${DAILY_AI_BUDGET_TOTAL:-500}
      # Vertex AI tramite il gateway su Cloud Run (vedi infra/gcp)
      - VERTEX_PROJECT=${VERTEX_PROJECT:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-europe-west4}
      - VERTEX_MODEL=${VERTEX_MODEL:-gemini-2.5-flash-lite}
      - VERTEX_CREDENTIALS_JSON=${VERTEX_CREDENTIALS_JSON:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
