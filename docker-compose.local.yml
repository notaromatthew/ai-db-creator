# Avvio completo in locale (solo sviluppo): app + Keycloak + Redis.
#   docker compose -f docker-compose.local.yml up --build
# App: http://localhost:8000   Keycloak: http://localhost:8080 (admin / admin)
# Le chiavi AI le imposti tu nell'ambiente (es. OPENAI_API_KEY) oppure in un file .env non versionato.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      APP_PUBLIC_URL: http://localhost:8000
      # il backend raggiunge Keycloak nella rete di Docker, il browser da localhost
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/aidbcreator
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_VERIFY_EMAIL: "false"
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/data/app.db
      RESEARCH_MODE: ${RESEARCH_MODE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - aidb-local-data:/app/data
      - aidb-local-projects:/app/projects
      - aidb-local-uploads:/app/uploads
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  aidb-local-data:
  aidb-local-projects:
  aidb-local-uploads:
