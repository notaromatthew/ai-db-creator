services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidbcreator}
      POSTGRES_USER: ${POSTGRES_USER:-aidbcreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--health-enabled=true"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aidbcreator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aidbcreator}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      BOOTSTRAP_KEYCLOAK: ${BOOTSTRAP_KEYCLOAK:-false}
    volumes:
      - uploads_data:/app/uploads
      - projects_data:/app/projects
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aidbcreator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aidbcreator}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - projects_data:/app/projects
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping --destination celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  projects_data:
