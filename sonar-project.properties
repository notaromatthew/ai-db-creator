# SonarQube: AI-DB-Creator. Il token NON sta nel repo: si passa con SONAR_TOKEN.
sonar.projectKey=ai-db-creator
sonar.projectName=AI-DB-Creator
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src,gateway
sonar.tests=backend/tests,gateway/tests,frontend/src
sonar.test.inclusions=backend/tests/**,gateway/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/public/**,**/*.test.ts,**/*.test.tsx,backend/alembic/**,gateway/tests/**

# Copertura: backend con `pytest --cov=app --cov-report=xml:coverage.xml` (da backend/),
# frontend con `vitest run --coverage` (lcov).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=backend/tests/**,backend/*.py,frontend/src/**/*.test.tsx

sonar.host.url=${env.SONAR_HOST_URL}
