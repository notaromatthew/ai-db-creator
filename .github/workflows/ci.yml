name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./test_app.db
      ENABLE_AUTH: "false"
      BOOTSTRAP_KEYCLOAK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app analyze_experiment.py check_research_gate.py participant_simulator.py power_scenarios.py research_readiness.py validate_arm_routes.py validate_datasets.py validate_event_coverage.py validate_expert_package.py validate_freeze_manifest.py validate_governance.py validate_reproducibility.py validate_workload_coverage.py
      - run: python -m pytest -q
      - run: python participant_simulator.py --output reports/participant-simulation
      - name: Assert versioned research gate (blocked is expected, drift fails)
        run: python check_research_gate.py --datasets ../data/datasets --expectations ../data/datasets/research-gate-expectations.json
      - name: Unified readiness (software gate only)
        run: python research_readiness.py --root .. --output reports/reproducibility --gate software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-deidentified-readiness-reports
          path: backend/reports/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
