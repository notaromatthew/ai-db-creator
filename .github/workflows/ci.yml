name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./test_app.db
      ENABLE_AUTH: "false"
      BOOTSTRAP_KEYCLOAK: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt
      - run: mkdir -p reports && python -m pip_audit -r requirements.txt -f cyclonedx-json -o reports/python-sbom.json
      - run: python -m compileall -q app alembic analyze_experiment.py authenticated_smoke.py check_research_gate.py migrate_database.py participant_simulator.py power_scenarios.py research_readiness.py validate_arm_routes.py validate_datasets.py validate_event_coverage.py validate_expert_package.py validate_freeze_manifest.py validate_governance.py validate_reproducibility.py validate_workload_coverage.py
      - run: python -m pytest -q
      - run: python participant_simulator.py --output reports/participant-simulation
      - name: Assert versioned research gate (blocked is expected, drift fails)
        run: python check_research_gate.py --datasets ../data/datasets --expectations ../data/datasets/research-gate-expectations.json
      - name: Unified readiness (software gate only)
        run: python research_readiness.py --root .. --output reports/reproducibility --gate software
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-deidentified-readiness-reports
          path: backend/reports/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > frontend-sbom.json
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.json
          retention-days: 14

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: aidbcreator
      POSTGRES_DB: aidbcreator
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-password
      ENABLE_AUTH: "true"
      BOOTSTRAP_KEYCLOAK: "true"
      LLM_PROVIDER: google
      LLM_MAX_REQUESTS_PER_MINUTE: "8"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install httpx==0.28.1
      - name: Build and start isolated stack
        run: |
          touch .env
          docker compose up -d --build
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            healthy_services="$(docker compose ps --format json | jq -r 'select(.Health == "healthy") | .Service' | sort -u | wc -l)"
            if [ "$healthy_services" -eq 6 ] && curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Assert all services healthy
        run: |
          test "$(docker compose ps --services --filter status=running | wc -l)" -eq 6
          test "$(docker compose ps --format json | jq -r 'select(.Health == "healthy") | .Service' | sort -u | wc -l)" -eq 6
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ready
      - name: Real Keycloak authentication smoke
        run: python backend/authenticated_smoke.py --admin-user "$KEYCLOAK_ADMIN_USER" --admin-password "$KEYCLOAK_ADMIN_PASSWORD"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Stop stack
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
